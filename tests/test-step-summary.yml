name: Test - Step Summary Output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_API_URL: https://api.github.com
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_RUN_ID: "1"
      GITHUB_SHA: "0000000000000000000000000000000000000000"
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty results directory
        run: mkdir -p "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts"

      - name: Create a temporary step summary file
        run: |
          SUMMARY_FILE=$(mktemp)
          echo "GITHUB_STEP_SUMMARY=$SUMMARY_FILE" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          results-path: "${{ github.workspace }}/BenchmarkDotNet.Artifacts"
          output-step-summary: "true"
          repo-token: "fake-token-not-used-when-no-results"
        continue-on-error: true

      - name: Assert action completed with step summary enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With no results, the action should warn but not fail even with output-step-summary enabled
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail when no results are found with output-step-summary enabled"
            exit 1
          fi
          echo "PASS: action completed without failure with output-step-summary enabled"
