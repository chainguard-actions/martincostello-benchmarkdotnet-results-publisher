name: Test output-file-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create benchmark result files
        run: |
          mkdir -p /tmp/benchmark-results-ofp/results
          cat > /tmp/benchmark-results-ofp/results/MyBenchmarks-report-full-compressed.json << 'EOF'
          {
            "Title": "MyBenchmarks-20240817-102749",
            "HostEnvironmentInfo": {
              "BenchmarkDotNetCaption": "BenchmarkDotNet",
              "BenchmarkDotNetVersion": "0.14.0",
              "OsVersion": "Ubuntu 22.04",
              "ProcessorName": "Intel Core i7",
              "PhysicalProcessorCount": 1,
              "PhysicalCoreCount": 4,
              "LogicalCoreCount": 8,
              "RuntimeVersion": ".NET 8.0.8",
              "Architecture": "X64",
              "HasAttachedDebugger": false,
              "HasRyuJit": true,
              "Configuration": "RELEASE",
              "DotNetCliVersion": "8.0.401",
              "ChronometerFrequency": { "Hertz": 10000000 },
              "HardwareTimerKind": "Unknown"
            },
            "Benchmarks": [
              {
                "DisplayInfo": "MyBenchmarks.Run: DefaultJob",
                "Namespace": "MyNamespace",
                "Type": "MyBenchmarks",
                "Method": "Run",
                "MethodTitle": "Run",
                "Parameters": "",
                "FullName": "MyNamespace.MyBenchmarks.Run",
                "HardwareIntrinsics": "AVX2",
                "Statistics": {
                  "N": 3,
                  "Min": 100.0,
                  "LowerFence": 90.0,
                  "Q1": 105.0,
                  "Median": 110.0,
                  "Mean": 110.0,
                  "Q3": 115.0,
                  "UpperFence": 130.0,
                  "Max": 120.0,
                  "InterquartileRange": 10.0,
                  "LowerOutliers": [],
                  "UpperOutliers": [],
                  "AllOutliers": [],
                  "StandardError": 5.0,
                  "Variance": 100.0,
                  "StandardDeviation": 10.0,
                  "Skewness": 0.0,
                  "Kurtosis": 1.5,
                  "ConfidenceInterval": {
                    "N": 3,
                    "Mean": 110.0,
                    "StandardError": 5.0,
                    "Level": 12,
                    "Margin": 15.0,
                    "Lower": 95.0,
                    "Upper": 125.0
                  },
                  "Percentiles": {
                    "P0": 100.0,
                    "P25": 105.0,
                    "P50": 110.0,
                    "P67": 112.0,
                    "P80": 115.0,
                    "P85": 116.0,
                    "P90": 117.0,
                    "P95": 118.0,
                    "P100": 120.0
                  }
                },
                "Memory": {
                  "Gen0Collections": 0,
                  "Gen1Collections": 0,
                  "Gen2Collections": 0,
                  "TotalOperations": 1000,
                  "BytesAllocatedPerOperation": 48
                }
              }
            ]
          }
          EOF

      - id: action
        name: Run action with output-file-path
        uses: .
        with:
          results-path: /tmp/benchmark-results-ofp
          output-file-path: /tmp/benchmark-output.json
          output-step-summary: 'false'
          name: 'OutputFilePathTest'
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with output-file-path input (outcome=$OUTCOME)"
