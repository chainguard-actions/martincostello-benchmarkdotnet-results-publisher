name: Test - Custom commit message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          results-path: '${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts'
          output-step-summary: 'false'
          commit-message: 'chore: update benchmark results [skip ci]'
          branch: 'gh-pages'
          name: 'MyBenchmarks'
        continue-on-error: true

      - name: Assert action ran with custom commit message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should find results and attempt to publish with the custom commit message.
          # Success or API-level failure are both acceptable in the test environment.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with commit-message"
          else
            echo "INFO: action did not succeed (outcome=$OUTCOME) - may be expected in test environment"
            echo "PASS: action ran with commit-message input"
          fi
