name: Test - Custom commit message and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with custom commit message and branch
        uses: .
        with:
          results-path: ${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts
          output-step-summary: 'false'
          branch: 'benchmarks'
          commit-message: 'chore: publish benchmark results'
          commit-message-prefix: '[Benchmarks]'
          name: 'CommitOptionsTest'
        continue-on-error: true

      - name: Assert action ran with commit options (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action accepts custom commit message and branch inputs.
          # It may fail when trying to push to the sentinel repo (sentinel doesn't exist).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom commit options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
