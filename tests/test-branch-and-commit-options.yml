name: Test branch and commit options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          results-path: ${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts
          output-step-summary: 'false'
          repo: test-owner/test-repo
          repo-token: invalid-token-for-testing
          branch: benchmark-results
          commit-message: 'chore: update benchmark results'
          commit-message-prefix: '[benchmarks]'
          name: MyBenchmarkSuite
        continue-on-error: true
      - name: Assert action fails due to invalid token (not due to missing results or bad inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid GitHub token when trying to push,
          # NOT because of bad inputs. This confirms the inputs were accepted and processed.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected due to invalid token (inputs were accepted)"
