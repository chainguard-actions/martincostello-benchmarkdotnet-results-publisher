name: Test custom results-path with no results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom results directory (empty)
        run: mkdir -p /tmp/custom-benchmark-results
      - id: action
        uses: .
        continue-on-error: true
        with:
          results-path: /tmp/custom-benchmark-results
          output-step-summary: 'false'
          output-file-path: /tmp/benchmark-output.json
          repo-token: 'fake-token-not-needed-when-no-results'
          branch: 'benchmark-results'
          name: 'MyCustomSuite'
          max-items: '100'
      - name: Assert action succeeded with warning for empty custom path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (warn) when no results found in custom path, got: $OUTCOME"
            exit 1
          fi
          echo "PASS"
