name: Test - No benchmark results found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty results directory
        run: mkdir -p "$GITHUB_WORKSPACE/empty-results"

      - id: action
        uses: .
        with:
          results-path: "${{ github.workspace }}/empty-results"
          output-step-summary: "false"
        continue-on-error: true

      - name: Assert action completed (warning for no results, not failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action warns when no results are found but should succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no results (warning emitted)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo may cause issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
