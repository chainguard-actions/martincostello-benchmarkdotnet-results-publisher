name: Test - No BenchmarkDotNet results found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty results directory
        run: mkdir -p "$GITHUB_WORKSPACE/empty-results"

      - id: action
        name: Run action with empty results directory
        uses: .
        with:
          results-path: ${{ github.workspace }}/empty-results
          output-step-summary: 'false'
        continue-on-error: true

      - name: Assert action completed (warning for no results, not failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed (with a warning) when no results are found
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable when no results found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
