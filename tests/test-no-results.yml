name: Test no benchmark results found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "123"
      GITHUB_SHA: "abc1234567890abcdef1234567890abcdef123456"
      GITHUB_SERVER_URL: "https://github.com"
      GITHUB_API_URL: "https://api.github.com"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty results directory
        run: mkdir -p /tmp/empty-benchmark-results

      - id: action
        uses: .
        with:
          repo-token: fake-token
          results-path: /tmp/empty-benchmark-results
          output-step-summary: "false"
        continue-on-error: true

      - name: Assert action completed (no results warning)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed (just warn) when no results are found
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with no results, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
