name: Test - Custom benchmark suite name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with custom name and no step summary
        uses: .
        with:
          results-path: ${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts
          output-step-summary: 'false'
          name: 'CustomSuiteName'
        continue-on-error: true

      - name: Assert action ran with custom name (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action finds results and processes them with the custom suite name,
          # but may fail when trying to push to the sentinel repo.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom suite name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
