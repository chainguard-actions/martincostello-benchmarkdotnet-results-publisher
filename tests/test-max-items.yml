name: Test - Max items input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with max-items input
        uses: .
        with:
          results-path: ${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts
          output-step-summary: 'false'
          max-items: '10'
          name: 'MaxItemsTest'
        continue-on-error: true

      - name: Assert action ran with max-items input (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action accepts the max-items input and processes results.
          # It may fail when trying to push to the sentinel repo (which doesn't exist on GitHub).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with max-items input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
