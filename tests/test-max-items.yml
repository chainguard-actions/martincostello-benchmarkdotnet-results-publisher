name: Test max-items input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty results directory
        run: mkdir -p /tmp/max-items-benchmarks
      - id: action
        uses: .
        with:
          results-path: /tmp/max-items-benchmarks
          max-items: '10'
          output-step-summary: 'false'
          repo-token: fake-token-for-testing
        continue-on-error: true
      - name: Assert action succeeded with max-items set and no results
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when no results are found with max-items set, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
