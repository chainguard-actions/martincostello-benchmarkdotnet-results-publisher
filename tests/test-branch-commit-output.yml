name: Test - Branch, Commit Message, and Output File Path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_API_URL: https://api.github.com
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_RUN_ID: "1"
      GITHUB_SHA: "0000000000000000000000000000000000000000"
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up GITHUB_STEP_SUMMARY
        run: |
          SUMMARY_FILE=$(mktemp)
          echo "GITHUB_STEP_SUMMARY=$SUMMARY_FILE" >> "$GITHUB_ENV"

      - name: Set output file path
        run: |
          OUTPUT_FILE=$(mktemp)
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          results-path: "${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts"
          output-step-summary: "false"
          repo-token: "fake-token-for-testing"
          branch: "benchmarks"
          commit-message: "chore: update benchmark results"
          output-file-path: "${{ env.OUTPUT_FILE }}"
          name: "MyBenchmarks"
        continue-on-error: true

      - name: Assert action attempted to publish with branch and commit-message inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the fake token can't push to GitHub,
          # NOT because it failed to parse inputs like branch, commit-message, or output-file-path.
          # A failure here means the action accepted and processed these inputs.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake token when results are found"
            exit 1
          fi
          echo "PASS: action accepted branch, commit-message, and output-file-path inputs and attempted to publish"
