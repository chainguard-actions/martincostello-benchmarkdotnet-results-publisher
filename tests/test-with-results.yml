name: Test - Benchmark results found and published
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up benchmark results directory from fixtures
        run: |
          # Copy fixture benchmark results to the default BenchmarkDotNet.Artifacts path
          mkdir -p "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/BenchmarkDotNet.Artifacts/results/MyBenchmarks-report-full-compressed.json" \
             "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/BenchmarkDotNet.Artifacts/results/MyBenchmarks-report-github.md" \
             "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results/"
          echo "Benchmark fixture files copied:"
          ls -la "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results/"

      - id: action
        uses: .
        with:
          output-step-summary: 'true'
          branch: 'gh-pages'
          name: 'MyBenchmarks'
          max-items: '100'
        continue-on-error: true

      - name: Assert action ran (success or expected API error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (if gh-pages branch exists and token has write access)
          # or fail with a GitHub API error (e.g. 403 forbidden for write access).
          # Either way, it should NOT fail due to missing/invalid JSON parsing.
          # We accept both success and failure here since the test environment
          # may not have write access to push to gh-pages.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded - results published to gh-pages"
          else
            echo "INFO: action did not succeed (outcome=$OUTCOME) - may be expected in test environment"
            echo "PASS: action ran and attempted to publish results"
          fi
