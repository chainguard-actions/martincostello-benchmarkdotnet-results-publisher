name: Test with benchmark results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          results-path: ${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts
          output-step-summary: 'false'
          repo: test-owner/test-repo
          repo-token: invalid-token-for-testing
        continue-on-error: true
      - name: Assert action fails due to invalid token (not due to missing results)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid GitHub token when trying to push,
          # NOT because results were not found. This confirms results were found and parsed.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid token when results are found, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected due to invalid token (results were found and processed)"
