name: Test - With BenchmarkDotNet Results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_API_URL: https://api.github.com
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_RUN_ID: "1"
      GITHUB_SHA: "0000000000000000000000000000000000000000"
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up GITHUB_STEP_SUMMARY
        run: |
          SUMMARY_FILE=$(mktemp)
          echo "GITHUB_STEP_SUMMARY=$SUMMARY_FILE" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          results-path: "${{ github.workspace }}/tests/fixtures/BenchmarkDotNet.Artifacts"
          output-step-summary: "false"
          repo-token: "fake-token-for-testing"
          name: "MyBenchmarks"
        continue-on-error: true

      - name: Assert action found results and failed at GitHub API (not file parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the fake token can't push to GitHub,
          # NOT because it failed to find or parse the benchmark results.
          # This verifies the action correctly found and parsed the fixture results.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake token when results are found"
            exit 1
          fi
          echo "PASS: action found results and attempted to publish (failed at GitHub API as expected with fake token)"
