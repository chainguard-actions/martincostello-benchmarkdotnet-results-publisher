name: Test fail-threshold-duration and fail-threshold-memory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          results-path: >-
            ${{ github.workspace }}/actions/hardened/martincostello--benchmarkdotnet-results-publisher/v2.0.2/tests/fixtures/BenchmarkDotNet.Artifacts
          output-step-summary: 'false'
          repo-token: 'fake-token-for-testing'
          repo: 'octocat/hello-world'
          fail-on-threshold: 'true'
          fail-threshold-duration: '1.1'
          fail-threshold-memory: '1.2'
      - name: Assert action ran (fail-threshold-duration and fail-threshold-memory inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at the API call (fake token),
          # but NOT fail due to unrecognized inputs.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at API call as expected with fake token"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
