name: Test - Step summary disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty results directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results"

      - id: action
        uses: .
        with:
          output-step-summary: 'false'
        continue-on-error: true

      - name: Assert action completed without failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With no results and output-step-summary=false, action should warn and complete
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly with output-step-summary=false"
            exit 1
          fi
          echo "PASS: action completed with output-step-summary=false"
