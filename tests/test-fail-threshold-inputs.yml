name: Test fail-threshold-duration and fail-threshold-memory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty results directory
        run: mkdir -p /tmp/threshold-benchmarks
      - id: action
        uses: .
        continue-on-error: true
        with:
          results-path: /tmp/threshold-benchmarks
          output-step-summary: 'false'
          repo-token: 'fake-token-not-needed-when-no-results'
          fail-on-threshold: 'true'
          fail-threshold-duration: '1.1'
          fail-threshold-memory: '1.2'
      - name: Assert action succeeded with no results (threshold inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when no results found (thresholds not triggered), got: $OUTCOME"
            exit 1
          fi
          echo "PASS"
