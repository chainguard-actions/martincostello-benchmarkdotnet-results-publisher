name: Test - Custom Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_API_URL: https://api.github.com
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_RUN_ID: "1"
      GITHUB_SHA: "0000000000000000000000000000000000000000"
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty results directory
        run: mkdir -p "$GITHUB_WORKSPACE/custom-results"

      - name: Set up GITHUB_STEP_SUMMARY
        run: |
          SUMMARY_FILE=$(mktemp)
          echo "GITHUB_STEP_SUMMARY=$SUMMARY_FILE" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          results-path: "${{ github.workspace }}/custom-results"
          output-step-summary: "false"
          repo-token: "fake-token-not-used-when-no-results"
          name: "CustomSuite"
          max-items: "10"
          commit-message-prefix: "[benchmark]"
          fail-on-threshold: "false"
          comment-on-threshold: "false"
          fail-threshold-duration: "2.0"
          fail-threshold-memory: "2.0"
        continue-on-error: true

      - name: Assert action completed with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With no results, the action should warn but not fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail when no results are found, even with custom inputs"
            exit 1
          fi
          echo "PASS: action accepted custom inputs and completed without failure"
