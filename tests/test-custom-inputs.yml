name: Test - Custom inputs (max-items, name, commit-message-prefix)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture benchmark results to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/BenchmarkDotNet.Artifacts/results/MyBenchmarks-report-full-compressed.json" \
             "$GITHUB_WORKSPACE/BenchmarkDotNet.Artifacts/results/"
          echo "Fixture JSON result copied."

      - id: action
        uses: .
        with:
          name: "CustomSuite"
          max-items: "10"
          commit-message-prefix: "[ci]"
          output-step-summary: "false"
        continue-on-error: true

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action accepts custom inputs and processes results.
          # API calls fail on the sentinel repo, so failure is expected.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
